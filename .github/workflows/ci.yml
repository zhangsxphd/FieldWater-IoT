name: FieldWater checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fieldwater-main
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Check tracked artifacts
        run: node scripts/check-repository.mjs
      - name: Backend and migration tests
        run: npm test --prefix backend
      - name: Frontend production build
        run: npm run build --prefix frontend
      - name: Install isolated browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser workflow against temporary database
        env:
          CI: 'true'
        run: npm run test:e2e --prefix frontend
